version: '3.9'

services:
  api:
    build:
      context: ./backend
    container_name: sistema-funilaria-api
    env_file:
      - ./backend/.env.example
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./frontend
    container_name: sistema-funilaria-web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

  postgres:
    image: postgres:16
    container_name: sistema-funilaria-db
    environment:
      POSTGRES_DB: funilaria
      POSTGRES_USER: funilaria
      POSTGRES_PASSWORD: funilaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sistema-funilaria-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
